
model_list:
  # Architecture planner: chat only, endpoint A. qwen2.5:3b has a 32k context,
  # which is the minimum that survives an OpenHands request (~20k tokens with
  # tool definitions and the system prompt).
  #
  # `openai/<model>` against ollama's own `/v1` endpoint, NOT `ollama_chat/`.
  # LiteLLM's ollama_chat handler re-serialises tool calls for the OpenAI wire
  # format and emits every parallel call under index=0, concatenating the
  # argument fragments into one unparseable string:
  #   {"path": "a.md"}{"path": "b.md"}
  # OpenHands rejects that ("Extra data: ... unparseable JSON"), the agent turn
  # dies, and it narrates instead of acting. Treating ollama as an
  # OpenAI-compatible server makes this a straight OpenAI -> OpenAI passthrough,
  # which preserves index=0/index=1 and keeps each call valid JSON.
  - model_name: architecture-model
    litellm_params:
      model: openai/qwen2.5:3b
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
    model_info:
      id: qwen2.5:3b
      mode: chat
      supports_function_calling: true
      max_input_tokens: 32768
      max_output_tokens: 4096

  # Coding worker: tool calling required, runs on the second server.
  # Same provider choice as above, for the same reason.
  - model_name: coding-model
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://host.docker.internal:11435/v1
      api_key: ollama
    model_info:
      id: qwen2.5-coder:7b
      mode: chat
      supports_function_calling: true
      max_input_tokens: 32768
      max_output_tokens: 4096

litellm_settings:
  drop_params: true
  request_timeout: 300
general_settings:
  # Do NOT set store_model_in_db here, and do not give this proxy a DATABASE_URL.
  # With a database attached, LiteLLM treats the model list as DB-backed state
  # while still only ever loading the router from this file at startup. The two
  # drift apart and /v1/models silently drops aliases, which surfaces as
  # "Invalid model name passed in model=<alias>" on every agent request.
  # This file is the single source of truth; restart litellm after editing it.
  store_model_in_db: false
