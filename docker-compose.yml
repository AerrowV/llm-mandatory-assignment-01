# LiteLLM routes each role alias to one of the two Ollama servers on the host;
# OpenHands runs the agents. Both ports are published on 127.0.0.1 only.
services:
  litellm:
    image: ghcr.io/berriai/litellm@sha256:32cfd7a427f6470033b4dcc9e75dfbea2aa32dbc298b0b511a40e962ce818362
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_BIND}:4000"
    volumes:
      - ./endpoints/config.yml:/app/config.yaml:ro
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      retries: 12
    extra_hosts:
      - "host.docker.internal:host-gateway"

  openhands:
    image: ghcr.io/openhands/agent-canvas@sha256:37575e4ece410efb267bee5a8e3119591a54e611fa0f75e06107f5d889e05c4c
    container_name: local-openhands
    depends_on:
      litellm:
        condition: service_healthy
    env_file: .env
    ports:
      - "${AGENT_BIND}:8000"
    volumes:
      - ./:/opt/project
      - ./openhands/state:/home/openhands/.openhands
    extra_hosts:
      - "host.docker.internal:host-gateway"
