litellm_settings:
  drop_params: true
  request_timeout: 300
  num_retries: 2
  # Fallback beats a dead run, but then the alias no longer names the model that
  # served, so a run record has to log the model actually used.
  fallbacks:
    - coder-1: [architect]
    - coder-2: [architect]
    - tester: [architect]
    - deploy-validator: [architect]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2

general_settings:
  store_model_in_db: false
